name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pnpm action takes no 'version' — it reads the packageManager field from
# package.json, which is what keeps CI and local machines on the same version.
# pnpm 11 requires Node >= 22.13, and this repo's .nvmrc satisfies that.

# No build step: Workers Builds compiles and publishes on every push and
# reports back as a check on the commit. `wrangler deploy --dry-run` here would
# only repeat the same compilation without publishing.

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    env:
      # wrangler tries to report metrics on its first run and, with no TTY,
      # that turns into a prompt which hangs the job.
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Format and lint in one pass. The script carries --error-on-warnings, so a
      # warning fails the job rather than scrolling past it. Wired only after the
      # reformat landed: a red CI on a knowingly unformatted repo teaches everyone
      # to ignore CI.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The unit suite only: vitest's default config excludes
      # tests/integration/**, the one suite that needs a real workerd.
      - name: Tests
        run: pnpm test

